<html>
  <head>
    <script type="text/javascript">
      // Payment links used to be /order/<id>; they're now order.html?id=<id>.
      var paymentLink = window.location.pathname.match(/^\/order\/([A-Za-z0-9-]+)\/?$/);
      window.location.replace(
        paymentLink ? "/order.html?id=" + paymentLink[1] : "/index.html"
      );
    </script>
  </head>
  <body>
    <i>Loading...</i>
  </body>
</html>
